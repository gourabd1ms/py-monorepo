name: Sonar project uuid probe
on:
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.SONAR_ADMIN }}
      A: https://api.sonarqube.us
    steps:
      - name: Find service_a/service_b UUIDs by key (read-only)
        run: |
          set +e
          echo "::add-mask::$T"
          U="$A/projects/projects?keys=gourabd1ms_py-monorepo_service_a,gourabd1ms_py-monorepo_service_b"
          code=$(curl -s -o p.json -w "%{http_code}" -H "Authorization: Bearer $T" "$U")
          echo "GET (by keys) -> $code"
          jq -r '.projects[] | "\(.key)  id=\(.id)"' p.json 2>/dev/null || head -c 600 p.json
