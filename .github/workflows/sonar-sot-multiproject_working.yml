name: Sonar SOT create + associate projects

# Idempotent: deletes any existing SOT with the same name, then creates one
# project-scoped SOT (browse / administer projects / execute analysis),
# associates it with c.demo and java.demo, then updates it to also cover
# perl.demo. Each step echoes the exact curl it runs (bearer token shown as a
# placeholder, never the real value).
#
# Role mapping: browse=user, administer projects=admin, execute analysis=scan.
# Caller (SONAR_ADMIN) must hold org admin to create/delete tokens.

on:
  workflow_dispatch:
    inputs:
      token_name:
        description: "Name for the scoped org token"
        default: "multiproj-browse-admin-scan"

env:
  A: https://api.sonarqube.us
  ORG_UUID: 705a240f-23f9-4524-86cf-f50f6ccac3a8

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.SONAR_ADMIN }}
      NAME: ${{ inputs.token_name }}
    steps:
      - name: 1. Delete any existing token with the same name (idempotency)
        run: |
          set +e
          echo "::add-mask::$T"
          URL="$A/authentication/token-definitions?organizationId=$ORG_UUID"
          echo "----- curl (list) -----"
          echo "curl -H 'Authorization: Bearer <SONAR_ADMIN>' '$URL'"
          echo "-----------------------"
          curl -s -H "Authorization: Bearer $T" "$URL" -o defs.json
          IDS=$(jq -r --arg n "$NAME" '(.tokenDefinitions // [])[] | select(.name==$n) | .id' defs.json 2>/dev/null)
          if [ -z "$IDS" ]; then echo "no existing token named '$NAME' - nothing to delete"; fi
          for id in $IDS; do
            echo "----- curl (delete) -----"
            echo "curl -X DELETE -H 'Authorization: Bearer <SONAR_ADMIN>' '$A/authentication/token-definitions/$id'"
            echo "-------------------------"
            code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: Bearer $T" "$A/authentication/token-definitions/$id")
            echo "deleted $id -> HTTP $code"
          done

      - name: 2. Create the scoped org token (project roles browse/administer/analysis)
        run: |
          set +e
          echo "::add-mask::$T"
          BODY='{"name":"'"$NAME"'","organizationId":"'"$ORG_UUID"'","roleAssignments":[{"resourceType":"project","roles":["user","admin","scan"]}],"autoGrantProjectPermissions":false}'
          echo "----- curl -----"
          echo "curl -X POST \\"
          echo "  -H 'Authorization: Bearer <SONAR_ADMIN>' \\"
          echo "  -H 'Content-Type: application/json' \\"
          echo "  '$A/authentication/token-definitions' \\"
          echo "  -d '$BODY'"
          echo "----------------"
          code=$(curl -s -o t.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
            -d "$BODY" "$A/authentication/token-definitions")
          echo "-> HTTP $code"
          jq -r '"created id=\(.id) name=\(.name) roles=\(.roleAssignments)"' t.json 2>/dev/null || head -c 300 t.json
          TID=$(jq -r '.id // empty' t.json 2>/dev/null)
          if [ -z "$TID" ]; then echo "::error::token not created"; exit 1; fi
          echo "TOKEN_ID=$TID" >> "$GITHUB_ENV"
          echo "NOTE: token value is in t.json (.token). Add 'jq -r .token t.json' to reveal it."

      - name: 3. Resolve project UUIDs (c.demo, java.demo, perl.demo)
        run: |
          set +e
          echo "::add-mask::$T"
          URL="$A/projects/projects?organizationIds=$ORG_UUID&pageSize=500"
          echo "----- curl -----"
          echo "curl -H 'Authorization: Bearer <SONAR_ADMIN>' '$URL'"
          echo "----------------"
          curl -s -H "Authorization: Bearer $T" "$URL" -o all.json
          for pair in C:gourabd1ms_c.demo JAVA:gourabd1ms_java.demo PERL:gourabd1ms_perl.demo; do
            var="${pair%%:*}"; key="${pair#*:}"
            uuid=$(jq -r --arg k "$key" '.projects[] | select(.key==$k) | .id' all.json 2>/dev/null | head -1)
            echo "$key -> ${uuid:-<not found>}"
            echo "${var}_UUID=$uuid" >> "$GITHUB_ENV"
          done

      - name: 4. Associate project c.demo
        run: |
          set +e
          echo "::add-mask::$T"
          if [ -z "${C_UUID:-}" ]; then echo "::error::c.demo UUID missing"; exit 1; fi
          body='{"organizationTokenId":"'"$TOKEN_ID"'","resourceType":"project","resourceId":"'"$C_UUID"'"}'
          echo "----- curl -----"
          echo "curl -X POST \\"
          echo "  -H 'Authorization: Bearer <SONAR_ADMIN>' \\"
          echo "  -H 'Content-Type: application/json' \\"
          echo "  '$A/authentication/token-resource-links' \\"
          echo "  -d '$body'"
          echo "----------------"
          code=$(curl -s -o l.json -w "%{http_code}" -X POST -H "Authorization: Bearer $T" \
            -H "Content-Type: application/json" -d "$body" "$A/authentication/token-resource-links")
          echo "-> HTTP $code"; head -c 200 l.json; echo

      - name: 5. Associate project java.demo
        run: |
          set +e
          echo "::add-mask::$T"
          if [ -z "${JAVA_UUID:-}" ]; then echo "::error::java.demo UUID missing"; exit 1; fi
          body='{"organizationTokenId":"'"$TOKEN_ID"'","resourceType":"project","resourceId":"'"$JAVA_UUID"'"}'
          echo "----- curl -----"
          echo "curl -X POST \\"
          echo "  -H 'Authorization: Bearer <SONAR_ADMIN>' \\"
          echo "  -H 'Content-Type: application/json' \\"
          echo "  '$A/authentication/token-resource-links' \\"
          echo "  -d '$body'"
          echo "----------------"
          code=$(curl -s -o l.json -w "%{http_code}" -X POST -H "Authorization: Bearer $T" \
            -H "Content-Type: application/json" -d "$body" "$A/authentication/token-resource-links")
          echo "-> HTTP $code"; head -c 200 l.json; echo

      - name: 6. Update - also associate project perl.demo
        run: |
          set +e
          echo "::add-mask::$T"
          if [ -z "${PERL_UUID:-}" ]; then echo "::error::perl.demo UUID missing"; exit 1; fi
          body='{"organizationTokenId":"'"$TOKEN_ID"'","resourceType":"project","resourceId":"'"$PERL_UUID"'"}'
          echo "----- curl -----"
          echo "curl -X POST \\"
          echo "  -H 'Authorization: Bearer <SONAR_ADMIN>' \\"
          echo "  -H 'Content-Type: application/json' \\"
          echo "  '$A/authentication/token-resource-links' \\"
          echo "  -d '$body'"
          echo "----------------"
          code=$(curl -s -o l.json -w "%{http_code}" -X POST -H "Authorization: Bearer $T" \
            -H "Content-Type: application/json" -d "$body" "$A/authentication/token-resource-links")
          echo "-> HTTP $code"; head -c 200 l.json; echo

      - name: 7. Verify token role assignments
        run: |
          set +e
          echo "::add-mask::$T"
          URL="$A/authentication/token-definitions?organizationId=$ORG_UUID"
          echo "----- curl -----"
          echo "curl -H 'Authorization: Bearer <SONAR_ADMIN>' '$URL'"
          echo "----------------"
          curl -s -H "Authorization: Bearer $T" "$URL" -o defs.json
          echo "=== our token ($TOKEN_ID) ==="
          jq -r --arg id "$TOKEN_ID" '(.tokenDefinitions // [])[] | select(.id==$id) | "name=\(.name) roles=\(.roleAssignments)"' defs.json 2>/dev/null || head -c 300 defs.json
          echo "(project associations are the token-resource-links created in steps 4-6)"
