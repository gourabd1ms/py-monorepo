name: Sonar (per-project)

# Individual SonarQube Cloud analysis for each Python project in this monorepo.
# Each project is its own Sonar project (distinct projectKey) and is scanned in
# a separate matrix job with sonar.projectBaseDir pointed at that subdirectory,
# so issues, coverage and the quality gate are reported per project.

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  analyze:
    name: analyze ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [ service_a, service_b ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history so Sonar can attribute new code

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and test ${{ matrix.project }} with coverage
        working-directory: projects/${{ matrix.project }}
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest coverage
          # coverage.xml is written into the project dir; the project's
          # sonar-project.properties points sonar.python.coverage.reportPaths at it.
          coverage run --source=src -m pytest
          coverage xml -o coverage.xml
          coverage report

      - name: Ensure Sonar project exists (gourabd1ms_py-monorepo_${{ matrix.project }})
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          KEY="gourabd1ms_py-monorepo_${{ matrix.project }}"
          code=$(curl -s -o /tmp/chk.json -w "%{http_code}" \
            -H "Authorization: Bearer $SONAR_TOKEN" \
            "https://sonarqube.us/api/projects/search?organization=gourabd1ms&projects=$KEY")
          total=$(python3 -c "import json;print(json.load(open('/tmp/chk.json'))['paging']['total'])" 2>/dev/null || echo 0)
          if [ "$code" = "200" ] && [ "$total" != "0" ]; then
            echo "Project $KEY already exists."
          else
            hc=$(curl -s -o /tmp/crt.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $SONAR_TOKEN" \
              "https://sonarqube.us/api/projects/create" \
              --data-urlencode "organization=gourabd1ms" \
              --data-urlencode "project=$KEY" \
              --data-urlencode "name=$KEY")
            echo "create HTTP $hc"; cat /tmp/crt.json
            if [ "$hc" != "200" ] && [ "$hc" != "201" ]; then
              echo "Failed to create Sonar project $KEY"; exit 1
            fi
          fi

      - name: SonarQube Cloud scan ${{ matrix.project }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarqube.us
        with:
          projectBaseDir: projects/${{ matrix.project }}
